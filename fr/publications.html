<body>

<main>

        <button class="filtre actif" data-categorie="all">Tous</button>

  <!-- 3. Toutes les publications, mélangées, la plus récente en premier -->
  <section class="pub-liste">
    <div class="conteneur">

<article class="carte" data-categorie="beyound-the-headlines">

    </a>
</article>
          </a>
        </article>

        <article class="carte" data-categorie="beyound-the-headlines">
          ...
        </article>

      </div>
      <p id="aucun-resultat" hidden>No publication found.</p>
    </div>
  </section>

</main>


  <!--Java for the filter search bar -->
  <script>
  const champ = document.getElementById('recherche');
  const boutons = document.querySelectorAll('.filtre');
  const cartes = document.querySelectorAll('#liste .carte');
  const message = document.getElementById('aucun-resultat');
  let categorie = 'all';

  function filtrer() {
    const texte = champ.value.toLowerCase().trim();
    let visibles = 0;

    cartes.forEach(function (carte) {
      const bonneCategorie = categorie === 'all' || carte.dataset.categorie === categorie;
      const bonTexte = carte.textContent.toLowerCase().includes(texte);
      const afficher = bonneCategorie && bonTexte;
      carte.hidden = !afficher;
      if (afficher) visibles++;
    });

    message.hidden = visibles > 0;
  }

  champ.addEventListener('input', filtrer);

  boutons.forEach(function (bouton) {
    bouton.addEventListener('click', function () {
      categorie = bouton.dataset.categorie;
      boutons.forEach(function (b) { b.classList.remove('actif'); });
      bouton.classList.add('actif');
      filtrer();
    });
  });

  // Permet d'arriver depuis le menu avec publications.html?cat=data-insights
  const params = new URLSearchParams(window.location.search);
  if (params.get('cat')) {
    const cible = document.querySelector('.filtre[data-categorie="' + params.get('cat') + '"]');
    if (cible) cible.click();
  }
</script>
